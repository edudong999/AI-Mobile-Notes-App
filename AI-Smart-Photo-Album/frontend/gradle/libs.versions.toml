[versions]
agp = "8.7.3"
kotlin = "1.9.22"
junit = "4.13.2"
# Original aliases used by frontend/app — kept at pre-commit values
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.13.0"
constraintlayout = "2.2.1"
recyclerview = "1.3.2"
flexbox = "3.0.0"
# Demo aliases used by frontend/ai_photo — spec-required values
appcompatDemo = "1.7.0"
materialDemo = "1.12.0"
activityDemo = "1.9.0"
constraintlayoutDemo = "2.1.4"
junitVersionDemo = "1.1.5"
espressoCoreDemo = "3.5.1"
# Additional versions for ai_photo module
coreKtx = "1.13.1"
swiperefreshlayout = "1.1.0"
navigation = "2.7.7"
lifecycle = "2.7.0"
fragment = "1.6.2"
retrofit = "2.9.0"
okhttp = "4.12.0"
glide = "4.16.0"
securityCrypto = "1.1.0-alpha06"

[libraries]
# Original aliases preserved at pre-commit versions for app module compatibility
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
flexbox = { group = "com.google.android.flexbox", name = "flexbox", version.ref = "flexbox" }

# Demo aliases for ai_photo module — point to spec-required versions
appcompat-demo = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompatDemo" }
material-demo = { group = "com.google.android.material", name = "material", version.ref = "materialDemo" }
activity-demo = { group = "androidx.activity", name = "activity", version.ref = "activityDemo" }
constraintlayout-demo = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayoutDemo" }
ext-junit-demo = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersionDemo" }
espresso-core-demo = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCoreDemo" }

# Additional aliases for ai_photo module (dashes converted to dots in accessors)
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
